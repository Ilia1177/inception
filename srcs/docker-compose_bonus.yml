version: '3.8'

services:
  nginx:
    container_name: nginx
    volumes:
    - "${HOST_VOLUME_PATH}/wordpress:/var/www/wordpress"
    - "${HOST_VOLUME_PATH}/html:/var/www/html"
    networks:
    - inception
    depends_on:
    - wordpress
    build: 
      context: requirements/nginx
      dockerfile: Dockerfile
    env_file: .env
    ports:
    - "443:443"
    restart: on-failure
  mariadb:
    container_name: mariadb
    networks:
    - inception
    build: 
      context: requirements/mariadb
      dockerfile: Dockerfile
    env_file: .env
    volumes: 
    - "${HOST_VOLUME_PATH}/mariadb:/var/lib/mysql"
    restart: unless-stopped
    expose:
    - "3306"
  wordpress:
      container_name: wordpress
      env_file: .env
      volumes:
      - "${HOST_VOLUME_PATH}/wordpress:/var/www/wordpress"
      networks:
      - inception
      build: 
        context: requirements/wordpress
        dockerfile: Dockerfile
      depends_on:
      - mariadb
      restart: on-failure
      expose: 
      - "9000"
  html:
    container_name: html
    env_file: .env
    build:
      context: requirements/bonus/html
      dockerfile: Dockerfile
    depends_on:
    - nginx
    networks:
    - inception
    volumes:
    - "${HOST_VOLUME_PATH}/html:/var/www/html"
    expose: 
    - "5050"

networks:
  inception:
    name: inception
    driver: bridge
    attachable: true
    labels:
      com.docker.compose.network: "inception"
      com.docker.compose.project: "inception"

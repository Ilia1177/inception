# Alpine Linux optimized vsftpd configuration
listen=YES
background=NO

# Disable anonymous and enable local users
anonymous_enable=NO
local_enable=YES

# File permissions
write_enable=YES
local_umask=022
file_open_mode=0666
local_root={{FTP_USER_DIR}}

# Chroot settings
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive mode
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
pasv_address={{PASV_ADDRESS}}

# Alpine-specific authentication fixes
check_shell=NO
seccomp_sandbox=NO


# Run in standalone mode
listen=YES
listen_ipv6=NO

# Access rights
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Security
chroot_local_user=YES
allow_writeable_chroot=YES

# User settings - vsftpd will switch to these users
# This is where the UID 1000 consistency matters
guest_enable=NO
virtual_use_local_privs=YES

# Passive mode
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address={{PASV_ADDRESS}}

# Logging
log_ftp_protocol=YES
xferlog_enable=YES
vsftpd_log_file=/var/log/vsftpd/vsftpd.log

# SSL
ssl_enable=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
rsa_cert_file=/etc/ssl/certs/vsftpd.crt
rsa_private_key_file=/etc/ssl/private/vsftpd.key

# Chroot directory
local_root={{FTP_USER_DIR}}

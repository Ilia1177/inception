	<script src="p5_sketchs/level_3.js"></script>
	<script>
				let max_width = 9999
				let sketch_index = 0;
				let p5_sketch;
				let sketches = [level_3, level_2, level_1];

				function p5_start(sketch) {
					if (p5_sketch) {
    					p5_sketch.remove(); // Remove old sketch
					}
  					p5_sketch = new p5(sketch);
				}
				p5_start(sketches[sketch_index]);
	</script>

<!DOCTYPE html>
<html>
<head>
	<link href="style.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
	<script src="p5/includes/p5.min.js"></script>
	<script src="p5/includes/p5.riso.js"></script>
	<script src="p5/includes/Cell.js"></script>
	<script src="p5/includes/Grid.js"></script>
	<script src="p5/PerlinFog.js" id="sketch"></script>
	<script>
			let max_width = 9999;

			//customize PerlinFog sketch
			function PerlinFog_digital(p) {
				// Call the original function to set up everything
				const original = PerlinFog(p);

				//rewrite function handleClick
				p.handleClick = function(grid, mouse) {
					for (let cell of grid.cells) {
						if (mouse.dist(cell.realPos) < 50 && cell.group == "title") {
								window.location.href = "analog.html";
						}
					}
				}
				return original;
			}

			new p5(PerlinFog_digital, 'background');
	</script>
	<script>
		// function to initailize the sketch in the container
		window.initializeSketch = function(actualSketch) {
		  new p5(actualSketch, 'sketch-container');
		};
        // Get the sketch number from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sketchNumber = urlParams.get('sketch') || '1';

        // Load the corresponding p5 script
        const script = document.createElement('script');
        script.src = `p5/sketches/sketch${sketchNumber}.js`;

        script.onload = function() {
            console.log(`Sketch ${sketchNumber} loaded`);
        };

        script.onerror = function() {
            console.error(`Failed to load sketch${sketchNumber}.js`);
        };
        document.head.appendChild(script);
	</script> 
</head>
<body>
	<div id="background"></div>
	<main>
    <div id="sketch-container"></div>
	</main>
</body>
</html>

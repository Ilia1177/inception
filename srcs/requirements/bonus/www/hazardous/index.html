<!DOCTYPE html>
<html lang="Eng">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>// HAZARDOUS //</title>
	<!-- STYLES --> 
	<link href="style.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">

	<!-- JAVASCRIPT -->
	<script src="p5/includes/p5.min.js"></script>
	<script src="p5/includes/Cell.js"></script>
	<script src="p5/includes/Grid.js"></script>
	<script src="p5/PerlinFog.js" id="sketch"></script>
	<script>
				let max_width = 9999;

				//customize PerlinFog sketch
				function PerlinFog_index(p) {
					// Call the original function to set up everything
					const original = PerlinFog(p);

					// Override the printText function
					p.printText = function(grid) {
						grid.buffer.background(255);
						grid.text_to_buffer("HAZARDOUS","center", 0, -45, 90);
						grid.text_to_buffer("- ÉDiTORiAL -","center", 0, 45, 80);
						grid.buffer_to_grid(180, "title");
					};

					p.handleClick = function(grid, mouse) {
						for (let cell of grid.cells) {
							if (mouse.dist(cell.realPos) < 50 && cell.group == "title") {
        							window.location.href = "analog.html";
							}
						}
					}
					return original;
				}

				window.onload = function () {
					new p5(PerlinFog_index, background);
				};
	</script>

</head>

<body>
  <div id="background"></div>
</body>

</html>

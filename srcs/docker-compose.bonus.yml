services:
  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
      args:
        INCLUDE_BONUS: "true"
    volumes:
      - ${HOST_VOLUME_PATH}/wordpress:/var/www/wordpress
      - ${HOST_VOLUME_PATH}/hazardous:/var/www/hazardous
      - ${HOST_VOLUME_PATH}/adminer:/var/www/adminer

  wordpress:
    depends_on:
      - mariadb
      - redis
    volumes:
      - "${HOST_VOLUME_PATH}/wordpress:/var/www/wordpress"

  hazardous:
    container_name: hazardous
    env_file: .env
    build:
      context: requirements/bonus/www
      dockerfile: Dockerfile
    depends_on:
    - nginx
    networks:
    - inception
    volumes:
    - "${HOST_VOLUME_PATH}/hazardous:/var/www/hazardous"
    image: hazardous:ft42
    user: "1000:1000"

  adminer:
    container_name: adminer
    build:
      context: requirements/bonus/adminer
      dockerfile: Dockerfile
    volumes:
    - ${HOST_VOLUME_PATH}/adminer:/var/www/adminer
    networks:
    - inception
    depends_on:
    - mariadb
    expose:
    - "9000"
    restart: unless-stopped
    image: adminer:ft42
    user: "1000:1000"

  redis:
    container_name: redis
    build:
      context: requirements/bonus/redis
      dockerfile: Dockerfile
    env_file: .env
    networks:
      - inception
    volumes:
      - "${HOST_VOLUME_PATH}/redis:/var/lib/redis"
    expose:
      - "6379"
    restart: unless-stopped
    image: redis:ft42
    user: "1000:1000"

  ftp:
    container_name: ftp
    build:
      context: requirements/bonus/ftp
      dockerfile: Dockerfile
    networks:
      - inception
    volumes:
      - "${HOST_VOLUME_PATH}/wordpress:/home/ftpuser/ftp/files"
    ports:
      - "20:20"
      - "21:21"
      - "21000-21010:21000-21010"
    env_file: .env
    restart: unless-stopped
    image: ftp:ft42
    cap_add:
      - SYS_CHROOT
      - SETUID
      - SETGID
    security_opt:
      - apparmor:unconfined
    user: "1000:1000"

  nodejs:
    container_name: nodejs
    build:
      context: requirements/bonus/nodejs
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - "${HOST_VOLUME_PATH}/hazardous:/var/www/hazardous:ro"
      - "${HOST_VOLUME_PATH}/node/uploads:/usr/src/app/uploads"
      - "${HOST_VOLUME_PATH}/node/public:/usr/public"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - hazardous
    networks:
      - inception
    image: nodejs:ft42
    user: "1000:1000"

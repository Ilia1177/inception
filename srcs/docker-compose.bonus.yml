services:
  nginx:
    volumes:
      - ${HOST_VOLUME_PATH}/wordpress:/var/www/wordpress
      - ${HOST_VOLUME_PATH}/hazardous:/var/www/hazardous
      - ${HOST_VOLUME_PATH}/adminer:/var/www/adminer

  wordpress:
    volumes:
      - "${HOST_VOLUME_PATH}/wordpress:/var/www/wordpress"

  hazardous:
    container_name: hazardous
    env_file: .env
    build:
      context: requirements/bonus/www
      dockerfile: Dockerfile
    depends_on:
    - nginx
    networks:
    - inception
    volumes:
    - "${HOST_VOLUME_PATH}/hazardous:/var/www/hazardous"
    image: hazardous:ft42

  adminer:
    container_name: adminer
    build:
      context: requirements/bonus/adminer
      dockerfile: Dockerfile
    volumes:
    - ${HOST_VOLUME_PATH}/adminer:/var/www/adminer
    networks:
    - inception
    depends_on:
    - mariadb
    expose:
    - "9000"
    restart: unless-stopped
    image: adminer:ft42
